<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<h2>Spots prüfen</h2>
<div id="list"></div>

<script>

const SUPABASE_URL = "https://vxucflqzkjzchjlibmvh.supabase.co"
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ4dWNmbHF6a2p6Y2hqbGlibXZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxMDgwMjcsImV4cCI6MjA4NzY4NDAyN30.YRQIAr34P_xiWPlhH8z7G21jt8sCRYiMRtpcF5lM6BI"

const { createClient } = supabase
const db = createClient(SUPABASE_URL, SUPABASE_ANON)

async function load(){

    const { data, error } = await db
    .from("spots")
    .select("*")
    .eq("approved", false)
    if (error) {
  console.error(error)
  return
}

if (!data) return

  const list = document.getElementById("list")
  list.innerHTML = ""

  data.forEach(s => {

    list.innerHTML += `
  <div style="border-bottom:1px solid #ccc;padding:10px">
    
    <b>${s.name}</b><br>
    ${s.email}<br><br>

    ${s.image_url ? `<img src="${s.image_url}" style="max-width:200px"><br><br>` : "Kein Bild<br><br>"}  

        <button onclick="approve('${s.id}')">Freigeben</button>
        <button onclick="remove('${s.id}')">Löschen</button>
      </div>
    `
  })
}

async function approve(id){
  await fetch("https://vxucflqzkjzchjlibmvh.supabase.co/functions/v1/admin-approve", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ id, action:"approve" })
  })
  load()
}

async function remove(id){
  await fetch("https://vxucflqzkjzchjlibmvh.supabase.co/functions/v1/admin-approve", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ id, action:"delete" })
  })
  load()
}

load()

</script>

</body>
</html>
