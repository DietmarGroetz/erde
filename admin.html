<body>

<h2>Spots prüfen</h2>
<div id="list"></div>

<script>

const SUPABASE_URL = "https://vxucflqzkjzchjlibmvh.supabase.co"
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ4dWNmbHF6a2p6Y2hqbGlibXZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxMDgwMjcsImV4cCI6MjA4NzY4NDAyN30.YRQIAr34P_xiWPlhH8z7G21jt8sCRYiMRtpcF5lM6BI"

// 🔐 API KEY ABFRAGE
let ADMIN_SECRET = prompt("Admin API Key:")

if (!ADMIN_SECRET) {
  document.body.innerHTML = "Kein API Key"
  throw new Error("No API Key")
}

// ✅ Supabase Client (war bei dir kaputt!)
const { createClient } = supabase
const db = createClient(SUPABASE_URL, SUPABASE_ANON)

// ✅ URL STATUS BADGE
function getUrlBadge(s) {
  if (!s.url_valid) {
    return `<span style="color:red;font-weight:bold;">❌ invalid</span>`
  }

  if (s.url_status === "blocked") {
    return `<span style="color:darkred;font-weight:bold;">🚫 blocked</span>`
  }

  if (s.url_status === "suspicious") {
    return `<span style="color:orange;font-weight:bold;">⚠️ suspicious</span>`
  }

  return `<span style="color:green;font-weight:bold;">✅ ok</span>`
}

async function load(){

  const { data, error } = await db
    .from("spots")
    .select("*")
    .eq("approved", false)

  if (error) {
    console.error("LOAD ERROR:", error)
    return
  }

  if (!data) return

  const list = document.getElementById("list")
  list.innerHTML = ""

  data.forEach(s => {

    list.innerHTML += `
      <div style="border-bottom:1px solid #ccc;padding:10px">
        
        <b>${s.name}</b><br>
        ${s.email}<br><br>

        ${s.image_url 
          ? `<img src="${s.image_url}" style="max-width:200px"><br><br>` 
          : "Kein Bild<br><br>"
        }

        <div>
          <b>URL:</b><br>
          ${s.link_url 
            ? `<a href="${s.link_url}" target="_blank">${s.link_url}</a>` 
            : "keine URL"
          }<br>
          ${getUrlBadge(s)}
        </div>
        <br>

        <button onclick="approve('${s.id}')">Freigeben</button>
        <button onclick="remove('${s.id}')">Löschen</button>
      </div>
    `
  })
}

async function approve(id){
  const res = await fetch("https://vxucflqzkjzchjlibmvh.supabase.co/functions/v1/admin-approve", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization": "Bearer " + ADMIN_SECRET
    },
    body: JSON.stringify({ id, action:"approve" })
  })

  console.log("APPROVE STATUS:", res.status)

  load()
}

async function remove(id){
  const res = await fetch("https://vxucflqzkjzchjlibmvh.supabase.co/functions/v1/admin-approve", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization": "Bearer " + ADMIN_SECRET
    },
    body: JSON.stringify({ id, action:"delete" })
  })

  console.log("DELETE STATUS:", res.status)

  load()
}

load()

</script>

</body>
</html>
