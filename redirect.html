<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Weiterleitung...</title>
</head>
<body>
<script>
const params = new URLSearchParams(window.location.search);

let spot = "";

// 👉 finde den richtigen Wert automatisch
for (const [key, value] of params.entries()) {
  if (value === "standard" || value === "premium" || value === "top") {
    spot = value;
    break;
  }
}

// 👉 Routing
if (spot === "standard") {
  window.location.href = "https://buy.stripe.com/bJe7sLg2I7u03ET55d5EY00";
}
else if (spot === "premium") {
  window.location.href = "https://buy.stripe.com/fZu9AT8zz9CWgrFgNV5EY01";
}
else if (spot === "top") {
  window.location.href = "https://buy.stripe.com/14A9ATaHH02m5N1fJR5EY02";
}
else {
  document.body.innerHTML = "Fehler – bitte erneut versuchen.";
}
</script>

</body>
</html>
